name: Notify downstream

# After a merge to main, sends a repository_dispatch event so that the
# repository publishing the posters picks up the new commit. Only runs on
# pushes to main of this repository, never on pull requests, so forks never
# see the app credentials. The target repository is configured with the
# DOWNSTREAM_REPO variable ("owner/name").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    if: github.repository == 'arukavina/algo-art-frames-public' && vars.DOWNSTREAM_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Split the target repository name
        id: target
        env:
          DOWNSTREAM_REPO: ${{ vars.DOWNSTREAM_REPO }}
        run: |
          echo "owner=${DOWNSTREAM_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${DOWNSTREAM_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Get a short-lived app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}

      - name: Send repository_dispatch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DOWNSTREAM_REPO: ${{ vars.DOWNSTREAM_REPO }}
        run: |
          gh api "repos/${DOWNSTREAM_REPO}/dispatches" \
            -f event_type=algorithms-updated \
            -f "client_payload[sha]=${{ github.sha }}"
