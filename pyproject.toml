[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-art-frames-public"
version = "0.2.0"
description = "Algorithm poster plugins and the SVG rendering SDK behind pseudocode.art"
readme = "README.md"
authors = [{ name = "Andrei Rukavina" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "svgwrite>=1.4",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["algo_art_frames*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
